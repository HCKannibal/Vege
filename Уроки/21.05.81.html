<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт с before и after</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #4a90e2;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        h1 {
            position: relative;
            display: inline-block;
        }

        /* Элемент before */
        h1::before {
            content: "★";
            color: gold;
            margin-right: 10px;
        }

        section {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        .card {
            position: relative;
            padding: 20px;
            border: 2px solid #4a90e2;
            border-radius: 10px;
            margin-top: 20px;
        }

        /* Элемент after */
        .card::after {
            content: "Новинка";
            position: absolute;
            top: -12px;
            right: 20px;
            background: crimson;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }

        button {
            padding: 12px 25px;
            border: none;
            background: #4a90e2;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            position: relative;
        }

        button::after {
            content: " →";
        }

        button:hover {
            background: #357abd;
        }
    </style>
</head>
<body>

    <header>
        <h1>Добро пожаловать</h1>
        <p>Пример использования ::before и ::after</p>
    </header>

    <section>
        <h2>О нас</h2>

        <div class="card">
            <p>
                Это демонстрационный блок. Метка «Новинка»
                создана с помощью псевдоэлемента <code>::after</code>.
            </p>
        </div>

        <br>

        <button>Подробнее</button>
    </section>

</body>
</html>
