<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Design</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 40px;
            border-radius: 25px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3),
                0 0 40px rgba(99, 102, 241, 0.2);
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 15px;
            font-size: 2.5rem;
        }

        p {
            color: rgba(255, 255, 255, 0.75);
            text-align: center;
            margin-bottom: 35px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: white;
            margin-bottom: 10px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid transparent;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Элемент focus */
        input:focus {
            border-color: #818cf8;
            box-shadow:
                0 0 0 4px rgba(129, 140, 248, 0.25),
                0 0 25px rgba(129, 140, 248, 0.5);
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.15);
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
        }

        /* Focus для кнопки */
        button:focus {
            outline: none;
            box-shadow:
                0 0 0 4px rgba(255, 255, 255, 0.2),
                0 0 0 8px rgba(129, 140, 248, 0.35);
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
        }

        .circle:nth-child(1) {
            width: 250px;
            height: 250px;
            background: #7c3aed;
            top: -80px;
            left: -80px;
        }

        .circle:nth-child(2) {
            width: 300px;
            height: 300px;
            background: #2563eb;
            bottom: -100px;
            right: -100px;
        }
    </style>
</head>

<body>

    <div class="circle"></div>
    <div class="circle"></div>

    <div class="container">
        <h1>Вход</h1>

        <p>
            Наведи курсор и попробуй нажать <strong>Tab</strong>,
            чтобы увидеть красивый эффект <code>:focus</code>.
        </p>

        <form>
            <div class="input-group">
                <label>Имя пользователя</label>
                <input type="text" placeholder="Введите имя">
            </div>

            <div class="input-group">
                <label>Пароль</label>
                <input type="password" placeholder="Введите пароль">
            </div>

            <button type="submit">
                Войти
            </button>
        </form>
    </div>

</body>
</html>
